# ODK form -> 121 program. Registration attributes are derived from the ODK form
# schema at run time and created in 121 before any registration is submitted.
environments:
  debug:
    run_targets:
      - id: registration-form
        data_source: dummy_submissions
        odk:
          project_id: 1
          form_id: registration_form
        121:
          program_id: 1
          preferred_language: en
        reference_id_field: __id
        # ODK question names become 121 attribute names, so name FSP-required
        # questions exactly as 121 expects them.
        required_attributes: [fullName, phoneNumber]
        output:
          mode: local
          path: output/

  test:
    run_targets:
      - id: registration-form
        data_source: odk_submissions
        odk:
          project_id: 46
          form_id: MPCA Project Test
        121:
          program_id: 8
          preferred_language: ar
        reference_id_field: __id
        required_attributes: [fullName, phoneNumber]
        output:
          mode: 121
          path: output/

  prod:
    run_targets:
      - id: registration-form
        data_source: odk_submissions
        odk:
          project_id: 1
          form_id: registration_form
        121:
          program_id: 1
          preferred_language: en
        reference_id_field: __id
        required_attributes: [fullName, phoneNumber]
        output:
          mode: 121
          path: output/
